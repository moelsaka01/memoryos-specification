<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<title>MemoryOS 1.3.1 ad scene v2</title>
<style>
  :root{--bg:#05080f;--fg:#f3f7ff;--mute:#a7b6cf;--acc:#4da3ff;--acc2:#35d6c0;--bad:#ff6b57;--warn:#ffb347;--good:#3ddc97}
  html,body{margin:0;padding:0;overflow:hidden;background:var(--bg);color:var(--fg)}
  body{font-family:"Segoe UI Variable Display","Segoe UI Variable Text","Segoe UI",system-ui,sans-serif;position:relative}
  #bg{position:absolute;inset:-10%;will-change:transform}
  #grid{position:absolute;inset:0;opacity:.55;background-image:linear-gradient(rgba(77,163,255,.07) 1px,transparent 1px),linear-gradient(90deg,rgba(77,163,255,.07) 1px,transparent 1px);background-size:64px 64px}
  #flash{position:absolute;inset:0;opacity:0;pointer-events:none}
  #vig{position:absolute;inset:0;background:radial-gradient(120% 90% at 50% 50%,transparent 55%,rgba(0,0,0,.55));pointer-events:none}
  .abs{position:absolute}
  .win{box-sizing:border-box;position:absolute;border-radius:22px;overflow:hidden;background:#101010;border:2px solid #2a3b57;will-change:transform}
  .win img{position:absolute;left:0;top:0;width:100%;height:100%;display:block}
  .win img.r{mix-blend-mode:screen;opacity:0}
  .beat{position:absolute;inset:0}
  .hl{position:absolute;font-weight:800;letter-spacing:-.02em;line-height:1.0;color:var(--fg);display:flex;flex-direction:column;justify-content:center}
  .ln{white-space:nowrap;display:block}
  .w{display:inline-block;will-change:transform,opacity,filter;margin-right:.24em}
  .acc{background:linear-gradient(90deg,var(--acc),var(--acc2));-webkit-background-clip:text;color:transparent}
  .bad{background:linear-gradient(90deg,var(--bad),var(--warn));-webkit-background-clip:text;color:transparent}
  .pill{position:absolute;box-sizing:border-box;display:flex;align-items:center;padding:0 22px;border-radius:99px;background:#06101f;font:700 24px "Cascadia Mono","Cascadia Code",Consolas,monospace;letter-spacing:.04em;white-space:nowrap;will-change:transform,opacity}
  .cap{position:absolute;font-weight:650;color:#e6eefc;will-change:transform,opacity;text-shadow:0 2px 18px rgba(0,0,0,.7)}
  .mono{font-family:"Cascadia Mono","Cascadia Code",Consolas,monospace}
  #prog{position:absolute;left:0;bottom:0;height:7px;background:linear-gradient(90deg,var(--acc),var(--acc2));width:0;box-shadow:0 0 18px rgba(77,163,255,.7)}
</style>
</head>
<body>
<div id="bg"></div><div id="grid"></div>
<div id="root"></div>
<div id="vig"></div><div id="flash"></div><div id="prog"></div>
<script>
const clamp = (x, a = 0, b = 1) => Math.min(b, Math.max(a, x));
const easeOut = (x) => 1 - Math.pow(1 - clamp(x), 3);
const easeBack = (x) => { const c1 = 1.7, c3 = c1 + 1; x = clamp(x); return 1 + c3 * Math.pow(x - 1, 3) + c1 * Math.pow(x - 1, 2); };
const easeIO = (x) => { x = clamp(x); return x < 0.5 ? 4 * x * x * x : 1 - Math.pow(-2 * x + 2, 3) / 2; };
const HEX = (size) => `<svg width="${size}" height="${size}" viewBox="0 0 34 34"><path class="hexp" d="M17 2.5 29.6 9.75v14.5L17 31.5 4.4 24.25V9.75Z" fill="none" stroke="#4da3ff" stroke-width="2.2" stroke-linejoin="round" pathLength="100" stroke-dasharray="100" stroke-dashoffset="0"/><circle class="hexc" cx="17" cy="17" r="4.2" fill="#35d6c0"/></svg>`;
const mk = (parent, cls, html, style) => { const d = document.createElement('div'); d.className = cls; if (html !== undefined) d.innerHTML = html; if (style) Object.assign(d.style, style); parent.appendChild(d); return d; };

let W, H, CFG, LY, beats = [], DURATION, WIN, IMGA, IMGB, FRAMES = 0, curSrc = '';

function layout(W, H) {
  if (W / H > 1.5) return { wide: true, panel: { x: 660, y: 190, w: 1160, h: 652 }, text: { x: 100, y: 190, w: 520, h: 652 }, hs: 100, capSize: 36, pillSize: 24 };
  if (H > W) return { wide: false, panel: { x: 60, y: 420, w: 960, h: 720 }, text: { x: 60, y: 70, w: 960, h: 320 }, hs: 112, capSize: 40, pillSize: 26 };
  return { wide: false, panel: { x: 60, y: 300, w: 960, h: 560 }, text: { x: 60, y: 50, w: 960, h: 230 }, hs: 100, capSize: 36, pillSize: 24 };
}
const place = (el, r) => { el.style.left = r.x + 'px'; el.style.top = r.y + 'px'; el.style.width = r.w + 'px'; if (r.h !== undefined) el.style.height = r.h + 'px'; };

function headline(parent, lines, rect, size) {
  const el = mk(parent, 'hl'); place(el, rect);
  const words = [];
  lines.forEach((ln) => {
    const row = mk(el, 'ln', '');
    ln.forEach((w) => { const s = document.createElement('span'); s.className = 'w' + (w.cls ? ' ' + w.cls : ''); s.textContent = w.t; s.style.fontSize = (size * (w.scale || 1)) + 'px'; row.appendChild(s); words.push({ s, at: w.at }); });
    // shrink the whole row until it fits the column
    let k = 1; row.style.visibility = 'hidden'; row.style.position = 'absolute';
    const natural = () => row.scrollWidth;
    while (natural() > rect.w && k > 0.35) { k -= 0.03; ln.forEach((w, i) => { row.children[i].style.fontSize = (size * (w.scale || 1) * k) + 'px'; }); }
    row.style.position = ''; row.style.visibility = '';
  });
  return { el, words };
}
function pop(words, u, dur = 0.5, rise = 46) {
  words.forEach(({ s, at }) => {
    const k = clamp((u - at) / dur), e = easeBack(k);
    s.style.opacity = String(clamp(k * 2.4));
    s.style.transform = `translateY(${((1 - e) * rise).toFixed(1)}px) scale(${(1.16 - 0.16 * easeOut(k)).toFixed(3)})`;
    s.style.filter = `blur(${((1 - easeOut(k)) * 14).toFixed(1)}px)`;
  });
}

// cfg: { W, H, frames:<dir url>, count, beats:[{t0,t1,lines,tl,tag,tagColor,cap,capMono,fine,hex,hit,shake,bad}], duration, cover }
function build(cfg) {
  CFG = cfg; W = cfg.W; H = cfg.H; LY = layout(W, H); DURATION = cfg.duration; FRAMES = cfg.count;
  document.documentElement.style.width = W + 'px'; document.documentElement.style.height = H + 'px';
  document.body.style.width = W + 'px'; document.body.style.height = H + 'px';
  const bg = document.getElementById('bg');
  bg.style.background = 'radial-gradient(42% 42% at 18% 22%,rgba(77,163,255,.34),transparent 70%),radial-gradient(48% 48% at 88% 82%,rgba(53,214,192,.26),transparent 70%),radial-gradient(30% 30% at 60% 8%,rgba(150,90,255,.16),transparent 70%),#05080f';
  const root = document.getElementById('root'); root.innerHTML = ''; beats = [];
  // the real footage window (one persistent panel; its pictures are the cut recordings)
  WIN = mk(root, 'win'); place(WIN, LY.panel); WIN.style.left = LY.panel.x + 'px';
  IMGA = document.createElement('img'); IMGB = document.createElement('img'); IMGB.className = 'r';
  WIN.appendChild(IMGA); WIN.appendChild(IMGB);
  const hs = LY.hs;
  const P = LY.panel;
  for (const bd of cfg.beats) {
    const el = mk(root, 'beat'); const b = { ...bd, el };
    const lines = (!LY.wide && bd.tl) ? bd.tl : bd.lines;
    const rect = LY.wide ? { ...LY.text } : { ...LY.text };
    const hl = headline(el, lines, rect, bd.hs ? bd.hs * hs : hs);
    // hex logo above the headline in the title / end beats
    let hex = null;
    if (bd.hex) { hex = mk(el, 'abs', HEX(Math.round(hs * 0.9)), { left: LY.text.x + 'px', top: (LY.wide ? LY.text.y + 20 : LY.text.y - 4) + 'px' }); if (!LY.wide) hex.style.display = 'none'; }
    // a late word (for example "Rejected.") on its own line, placed after the first lines
    let late = null;
    if (bd.late) late = headline(el, [bd.late.words], LY.wide ? { x: LY.text.x, y: LY.text.y + LY.text.h * 0.5 + 10, w: LY.text.w, h: LY.text.h * 0.4 } : { x: LY.text.x, y: LY.text.y + (bd.late.dy || 100), w: LY.text.w, h: 140 }, hs * (bd.late.size || 1.1));
    if (late) late.el.style.justifyContent = 'flex-start';
    const pillY = P.y + P.h + 24;
    let pill = null;
    if (bd.tag) pill = mk(el, 'pill', bd.tag, { left: P.x + 'px', top: pillY + 'px', height: Math.round(LY.pillSize * 1.9) + 'px', fontSize: LY.pillSize + 'px', color: bd.tagColor || '#3ddc97', border: '2px solid ' + (bd.tagColor || '#3ddc97') });
    const capTop = pillY + (bd.tag ? Math.round(LY.pillSize * 1.9) + 18 : 0);
    let cap = null, fine = null;
    if (bd.cap) {
      cap = mk(el, 'cap' + (bd.capMono ? ' mono' : ''), bd.cap, { left: P.x + 'px', top: capTop + 'px', width: P.w + 'px', fontSize: (bd.capMono ? LY.capSize * 0.82 : LY.capSize) + 'px', lineHeight: '1.18', color: bd.capMono ? '#7cc0ff' : '#e6eefc' });
    }
    if (bd.fine) fine = mk(el, 'cap', bd.fine, { left: P.x + 'px', top: (capTop + (cap ? LY.capSize * (bd.capMono ? 1.7 : 2.4) : 0)) + 'px', width: P.w + 'px', fontSize: (LY.capSize * 0.62) + 'px', color: '#a7b6cf', fontWeight: 550, lineHeight: '1.3' });
    if (cfg.cover && bd.brand) {
      mk(el, 'abs', `<span style="display:inline-flex;align-items:center;gap:16px;font-weight:700;font-size:${LY.wide ? 40 : 38}px">${HEX(LY.wide ? 52 : 48)}<span>MemoryOS <span style="color:#93a3bd;font-weight:600">1.3.1</span></span></span>`, { left: LY.text.x + 'px', top: (LY.wide ? LY.text.y - 120 : 8) + 'px' });
    }
    b.hl = hl; b.late = late; b.hexEl = hex; b.pill = pill; b.capEl = cap; b.fineEl = fine;
    beats.push(b);
  }
  return DURATION;
}

function setFootage(t) {
  const n = clamp(Math.round(t * 30), 0, FRAMES - 1);
  const src = CFG.frames + '/f' + String(n + 1).padStart(5, '0') + '.jpg';
  if (src === curSrc) return Promise.resolve();
  curSrc = src; IMGA.src = src;
  return IMGA.decode().catch(() => {});
}

function renderAt(t) {
  const beat = (t * 2) % 1;                                   // 120 BPM grid
  const pulse = Math.pow(1 - beat, 4);
  const bg = document.getElementById('bg');
  bg.style.transform = `translate(${(Math.sin(t * 0.45) * 55).toFixed(1)}px,${(Math.cos(t * 0.33) * 40).toFixed(1)}px) scale(${(1.08 + 0.04 * Math.sin(t * 0.25)).toFixed(3)}) rotate(${(Math.sin(t * 0.15) * 2).toFixed(2)}deg)`;
  document.getElementById('grid').style.backgroundPosition = `${(t * 14).toFixed(1)}px ${(t * 9).toFixed(1)}px`;
  let flashA = 0, flashC = '255,107,87', shake = 0, split = 0, punch = 0;
  let active = null;
  for (const b of beats) {
    const on = t >= b.t0 - 0.001 && t <= b.t1 + 0.001;
    b.el.style.display = on ? 'block' : 'none';
    if (!on) continue;
    active = b;
    const first = b.t0 <= 0.001, lastB = b.t1 >= DURATION - 0.001;
    const fadeIn = first ? 1 : easeOut((t - b.t0) / 0.22), fadeOut = lastB ? 1 : easeOut((b.t1 - t) / 0.22);
    b.el.style.opacity = String(Math.min(fadeIn, fadeOut).toFixed(3));
    const u = t - b.t0;
    pop(b.hl.words, u, 0.5, 46);
    if (b.late) pop(b.late.words, u, 0.45, 40);
    if (b.hexEl) { const k = clamp(u / 0.7); b.hexEl.querySelector('.hexp').setAttribute('stroke-dashoffset', String((1 - easeIO(k)) * 100)); b.hexEl.querySelector('.hexc').style.opacity = String(easeOut((u - 0.45) / 0.3)); }
    const slide = (el, at, dy) => { if (!el) return; const k = easeOut((u - at) / 0.45); el.style.opacity = String(k); el.style.transform = `translateY(${((1 - k) * dy).toFixed(1)}px)`; };
    slide(b.pill, 0.1, 22); slide(b.capEl, b.capAt ?? 0.55, 26); slide(b.fineEl, 1.2, 18);
    if (b.hit !== undefined) {
      const d = u - b.hit;
      if (d >= 0 && d < 0.5) { flashA = (1 - d / 0.5) * 0.55; shake = Math.exp(-d * 9) * Math.sin(d * 80); split = Math.exp(-d * 7); }
      if (d >= 0) flashC = '255,107,87';
    }
    punch = Math.max(punch, Math.exp(-u * 9));                  // a small push on every cut
  }
  // the panel: enters with the first beat, pulses on the beat, shakes on a hit
  const entry = easeOut(t / 0.7);
  const sc = 0.965 + 0.035 * entry + 0.012 * pulse + 0.02 * punch;
  WIN.style.opacity = String(entry);
  const rise = (1 - entry) * 60;
  WIN.style.transform = `translate(${(shake * 14).toFixed(1)}px,${(rise + shake * -6).toFixed(1)}px) scale(${sc.toFixed(4)})`;
  const hot = active && active.bad ? '255,107,87' : '77,163,255';
  WIN.style.boxShadow = `0 40px 110px rgba(0,0,0,.65),0 0 ${(40 + 50 * pulse).toFixed(0)}px rgba(${hot},${(0.30 + 0.25 * pulse).toFixed(2)})`;
  WIN.style.borderColor = `rgba(${hot},${(0.55 + 0.3 * pulse).toFixed(2)})`;
  IMGB.style.opacity = '0';
  if (split > 0.02) { IMGB.src = IMGA.src; IMGB.style.opacity = String((split * 0.45).toFixed(2)); IMGB.style.transform = `translateX(${(split * 12).toFixed(1)}px)`; IMGB.style.filter = 'hue-rotate(160deg) saturate(2.4)'; }
  const fl = document.getElementById('flash');
  fl.style.background = `radial-gradient(circle at 50% 55%,rgba(${flashC},.75),rgba(${flashC},.15) 65%,transparent 90%)`;
  fl.style.opacity = flashA.toFixed(3);
  document.getElementById('prog').style.width = CFG.cover ? '0px' : (t / DURATION * W).toFixed(1) + 'px';
  return setFootage(t);
}
window.build = build; window.renderAt = renderAt;
</script>
</body>
</html>
