<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<title>MemoryOS 1.3.0 walkthrough scene</title>
<style>
  html,body{margin:0;padding:0;background:#070b13;width:1920px;height:1080px;overflow:hidden}
  body{font-family:"Segoe UI Variable Text","Segoe UI",system-ui,sans-serif;color:#e8eef8}
  #stage{position:absolute;left:0;top:72px;width:1920px;height:864px;background:#0a0f19;overflow:hidden}
  #stage.full{top:0;height:1080px}
  .layer{position:absolute;inset:0}
  /* terminal */
  #term{position:absolute;left:40px;top:22px;right:40px;bottom:22px;background:#0d1420;border:1px solid #1c2738;border-radius:12px;overflow:hidden;display:flex;flex-direction:column}
  #tbar{height:44px;flex:none;background:#101a2a;border-bottom:1px solid #1c2738;display:flex;align-items:center;padding:0 18px;font:500 17px "Segoe UI",system-ui,sans-serif;color:#8d9bb2;gap:10px}
  #tbar i{width:12px;height:12px;border-radius:50%;background:#2a3850;display:inline-block}
  #tbar span{margin-left:8px}
  #tbar em{margin-left:auto;font-style:normal;color:#5d6d88}
  #screen{flex:1;display:flex;flex-direction:column;justify-content:flex-end;padding:18px 26px 20px;overflow:hidden;font:400 24px/33px "Cascadia Mono","Cascadia Code",Consolas,monospace;white-space:pre-wrap;word-break:break-all}
  .ln{min-height:33px;flex:none}
  .gap{height:14px;flex:none}
  .pr{color:#35d6c0;margin-right:12px}
  .c0{color:#7cc0ff;font-weight:700}
  .fl{color:#9db0cc}
  .pa{color:#8fe3d4}
  .tx{color:#e8eef8}
  .k{color:#7f8da6}
  .v{color:#e8eef8}
  .dg{color:#7fd8c8}
  .er{color:#ff8f8f}
  .ex{color:#6f7f99;font-size:20px}
  .ex.z{color:#5be08a}.ex.nz{color:#f5b042}
  .cur{display:inline-block;width:13px;height:26px;background:#cfe3ff;vertical-align:-4px;margin-left:2px}
  /* cards */
  .card{position:absolute;inset:0;display:flex;flex-direction:column;align-items:center;justify-content:center;text-align:center}
  .card h1{margin:0;font-size:120px;letter-spacing:-1px;font-weight:700;background:linear-gradient(90deg,#7cc0ff,#35d6c0);-webkit-background-clip:text;color:transparent}
  .card h2{margin:18px 0 0;font-size:46px;font-weight:500;color:#cfd9ea}
  .card p{margin:28px 0 0;font-size:30px;color:#8d9bb2}
  .card .fine{position:absolute;bottom:56px;left:0;right:0;font-size:24px;color:#6f7f99}
  .card .url{font:600 40px "Cascadia Mono",Consolas,monospace;color:#7cc0ff;margin-top:40px}
  .card ul{list-style:none;margin:32px 0 0;padding:0;font-size:34px;color:#cfd9ea;line-height:1.7}
  #map{position:absolute;inset:0;display:grid;grid-template-columns:1fr 1fr;gap:20px 40px;padding:44px 80px;align-content:center}
  .m{display:flex;align-items:center;gap:22px;background:#0d1420;border:1px solid #1c2738;border-radius:14px;padding:0 26px;height:132px;font-size:35px;font-weight:600}
  .m b{font:700 30px "Cascadia Mono",Consolas,monospace;color:#7cc0ff;min-width:66px}
  .m.hot{border-color:#4da3ff;box-shadow:0 0 0 1px #4da3ff inset}
  .m.deep{border-color:#35d6c0}
  .m.deep b{color:#35d6c0}
  .m span{line-height:1.2}
</style>
</head>
<body>
<div id="stage"></div>
<script src="chrome.js"></script>
<script>
MosChrome.install(document);
const stage = document.getElementById('stage');
const MILESTONE_NAMES = {
  '1301': 'Investigation Policies', '1302': 'GitHub Actions and Deterministic CI Policy Gates', '1303': 'VS Code Extension',
  '1304': 'MCP Server and Agent Integration', '1305': 'REST Gateway', '1306': 'Provider-Neutral CI/CD Integration',
  '1307': 'Release Governance and Readiness', '1308': 'Investigation History', '1309': 'Cloud Dashboard'
};
const esc = (s) => s.replace(/&/g, '&amp;').replace(/</g, '&lt;').replace(/>/g, '&gt;');
const clamp = (x, a = 0, b = 1) => Math.min(b, Math.max(a, x));
const ease = (x) => 1 - Math.pow(1 - clamp(x), 3);

let beat = null, plan = null;

function tokensHtml(cmd) {
  const parts = cmd.match(/'[^']*'|\S+|\s+/g) || [];
  let first = true;
  return parts.map((p) => {
    if (/^\s+$/.test(p)) return p;
    let cls = 'tx';
    if (first) { cls = 'c0'; first = false; }
    else if (p.startsWith('--') || p.startsWith("-")) cls = 'fl';
    else if (/[\/\\]|\.\w+$/.test(p)) cls = 'pa';
    return `<span class="${cls}">${esc(p)}</span>`;
  }).join('');
}
function outLine(line, err) {
  if (err) return `<div class="ln er">${esc(line)}</div>`;
  const m = /^([A-Za-z][A-Za-z0-9]*): (.*)$/.exec(line);
  if (m) {
    const v = /^sha256:/.test(m[2]) ? `<span class="dg">${esc(m[2])}</span>` : `<span class="v">${esc(m[2])}</span>`;
    return `<div class="ln"><span class="k">${m[1]}:</span> ${v}</div>`;
  }
  return `<div class="ln v">${esc(line).replace(/(sha256:[0-9a-f]{64})/g, '<span class="dg">$1</span>')}</div>`;
}

function buildPlan(b) {
  const out = { steps: [], captions: [], duration: 0 };
  if (b.kind !== 'term') return out;
  const cps = b.speed || 40, gap = b.gap === undefined ? 0.7 : b.gap;
  let t = b.lead === undefined ? 0.5 : b.lead;
  b.steps.forEach((s, i) => {
    const lines = (s.stdout || '').split('\n').filter((l, j, arr) => !(j === arr.length - 1 && l === ''));
    const errLines = (s.stderr || '').split('\n').filter((l, j, arr) => !(j === arr.length - 1 && l === ''));
    const all = lines.map((l) => [l, false]).concat(errLines.map((l) => [l, true]));
    const typeDur = Math.min(s.display.length / cps, b.maxType || 2.4);
    const typeStart = t, typeEnd = t + typeDur;
    const outStart = typeEnd + 0.3;
    const outDur = Math.min(b.maxReveal || 0.9, all.length * 0.04);
    out.steps.push({ s, all, typeStart, typeEnd, outStart, outDur });
    t = outStart + outDur + gap;
  });
  out.duration = t - gap + (b.hold === undefined ? 2.0 : b.hold);
  (b.captions || []).forEach((c) => {
    const at = c.step !== undefined ? out.steps[c.step].typeStart : c.at;
    out.captions.push({ at, text: c.text });
  });
  out.captions.sort((a, b2) => a.at - b2.at);
  return out;
}

function load(b) {
  beat = b; plan = buildPlan(b);
  stage.className = b.fullbleed ? 'full' : '';
  stage.innerHTML = '';
  document.getElementById('mos-top').style.display = b.fullbleed ? 'none' : 'flex';
  document.getElementById('mos-bottom').style.display = b.fullbleed ? 'none' : 'flex';
  if (b.kind === 'term') {
    stage.innerHTML = '<div id="term"><div id="tbar"><i></i><i></i><i></i><span id="ttitle"></span><em id="tnode"></em></div><div id="screen"></div></div>';
    document.getElementById('tnode').textContent = b.nodeLabel || '';
  } else if (b.kind === 'map') {
    stage.innerHTML = '<div id="map">' + ['1301','1302','1303','1304','1305','1306','1307','1308','1309'].map((m) => `<div class="m" data-m="${m}"><b>${m}</b><span>${MILESTONE_NAMES[m]}</span></div>`).join('') + '</div>';
    plan.duration = b.duration;
  } else if (b.kind === 'title') {
    stage.innerHTML = `<div class="card"><h1>MemoryOS 1.3.0</h1><h2>${esc(b.subtitle)}</h2><p>${esc(b.line)}</p><div class="fine">${esc(b.fine)}</div></div>`;
    plan.duration = b.duration;
  } else if (b.kind === 'close') {
    stage.innerHTML = `<div class="card"><h1>MemoryOS 1.3.0</h1><h2>${esc(b.subtitle)}</h2><ul>${b.points.map((p) => `<li>${esc(p)}</li>`).join('')}</ul><div class="url">${esc(b.url)}</div><div class="fine">${esc(b.fine)}</div></div>`;
    plan.duration = b.duration;
  }
  return plan.duration;
}

function renderAt(t) {
  let sig = '';
  const fadeIn = clamp(t / 0.3), fadeOut = clamp((plan.duration - t) / 0.3);
  stage.style.opacity = String(Math.min(fadeIn, fadeOut).toFixed(2));
  sig += stage.style.opacity;
  // chrome
  let caption = '', capAge = 9;
  if (plan.captions.length || beat.caption) {
    const list = plan.captions.length ? plan.captions : [{ at: 0, text: beat.caption }];
    let cur = null;
    for (const c of list) if (t >= c.at) cur = c;
    if (cur) { caption = cur.text; capAge = t - cur.at; }
  }
  if (!beat.fullbleed) {
    MosChrome.set({ chapterCode: beat.chapter && beat.chapter.code, chapterTitle: beat.chapter && beat.chapter.title, current: beat.chapter && beat.chapter.current,
      caption, captionAlpha: ease(capAge / 0.3).toFixed(2), captionShift: ((1 - ease(capAge / 0.3)) * 12).toFixed(1), note: beat.note || '' });
    sig += '|' + caption + ease(capAge / 0.3).toFixed(2) + (beat.chapter ? beat.chapter.title : '');
  }
  if (beat.kind === 'term') {
    document.getElementById('ttitle').textContent = beat.titleLabel || '';
    let html = '';
    let any = false;
    plan.steps.forEach((p) => {
      if (t < p.typeStart) return;
      const typed = clamp((t - p.typeStart) / Math.max(0.001, p.typeEnd - p.typeStart));
      const n = Math.floor(typed * p.s.display.length + 1e-6);
      const done = t >= p.typeEnd;
      html += `<div class="ln"><span class="pr">&#10095;</span>${tokensHtml(p.s.display.slice(0, n))}${done ? '' : '<span class="cur"></span>'}</div>`;
      if (t >= p.outStart) {
        const frac = p.outDur === 0 ? 1 : clamp((t - p.outStart) / p.outDur);
        const k = Math.ceil(frac * p.all.length - 1e-6);
        for (let i = 0; i < k; i++) html += outLine(p.all[i][0], p.all[i][1]);
        if (k >= p.all.length) html += `<div class="ln ex ${p.s.exit === 0 ? 'z' : 'nz'}">exit ${p.s.exit}</div>`;
      }
      html += '<div class="gap"></div>';
      any = true;
    });
    const last = plan.steps[plan.steps.length - 1];
    const allDone = t >= last.outStart + last.outDur;
    if (allDone && Math.floor(t * 2) % 2 === 0) html += '<div class="ln"><span class="pr">&#10095;</span><span class="cur"></span></div>';
    else if (allDone) html += '<div class="ln"><span class="pr">&#10095;</span></div>';
    else if (!any) html += '<div class="ln"><span class="pr">&#10095;</span><span class="cur"></span></div>';
    document.getElementById('screen').innerHTML = html;
    sig += html.length + ':' + html.slice(-80);
  } else if (beat.kind === 'map') {
    const items = [...document.querySelectorAll('.m')];
    items.forEach((el, i) => {
      const a = ease((t - (0.4 + i * 0.45)) / 0.35);
      el.style.opacity = a.toFixed(2);
      el.style.transform = `translateY(${((1 - a) * 18).toFixed(1)}px)`;
      el.classList.toggle('deep', el.dataset.m === '1308' || el.dataset.m === '1309');
      sig += a.toFixed(2);
    });
  } else {
    const card = document.querySelector('.card');
    const a = ease(t / 0.8);
    card.style.transform = `scale(${(0.97 + 0.03 * a).toFixed(3)})`;
    sig += a.toFixed(3);
  }
  return { sig, duration: plan.duration };
}
window.load = load; window.renderAt = renderAt;
</script>
</body>
</html>
