<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<title>MemoryOS 1.3 ad scene</title>
<style>
  :root{--bg:#05080f;--fg:#f3f7ff;--mute:#93a3bd;--acc:#4da3ff;--acc2:#35d6c0;--bad:#ff6b57;--warn:#ffb347;--line:#1c2738;--panel:#0b1220}
  html,body{margin:0;padding:0;overflow:hidden;background:var(--bg);color:var(--fg)}
  body{font-family:"Segoe UI Variable Display","Segoe UI Variable Text","Segoe UI",system-ui,sans-serif;position:relative}
  #bg{position:absolute;inset:-10%;will-change:transform}
  #grid{position:absolute;inset:0;opacity:.5;
    background-image:linear-gradient(rgba(77,163,255,.06) 1px,transparent 1px),linear-gradient(90deg,rgba(77,163,255,.06) 1px,transparent 1px);background-size:64px 64px}
  #flash{position:absolute;inset:0;background:radial-gradient(circle at 50% 60%,rgba(255,107,87,.35),transparent 60%);opacity:0}
  .beat{position:absolute;inset:0;opacity:0}
  .abs{position:absolute}
  .hl{position:absolute;font-weight:750;letter-spacing:-.02em;line-height:1.02;color:var(--fg)}
  .w{display:inline-block;will-change:transform,opacity,filter;margin-right:.26em}
  .acc{background:linear-gradient(90deg,var(--acc),var(--acc2));-webkit-background-clip:text;color:transparent}
  .bad{background:linear-gradient(90deg,var(--bad),var(--warn));-webkit-background-clip:text;color:transparent}
  .sub{position:absolute;color:var(--mute);font-weight:550;letter-spacing:0}
  .panel{box-sizing:border-box;position:absolute;background:var(--panel);border:1px solid #223049;border-radius:22px;overflow:hidden;box-shadow:0 30px 90px rgba(0,0,0,.55),0 0 0 1px rgba(77,163,255,.08)}
  .pbar{height:46px;display:flex;align-items:center;gap:9px;padding:0 20px;background:#0f1a2c;border-bottom:1px solid #1c2738;font:500 17px "Segoe UI",system-ui,sans-serif;color:var(--mute)}
  .pbar i{width:12px;height:12px;border-radius:50%;background:#2a3850;display:inline-block}
  .pbar span{margin-left:8px}
  .screen{position:absolute;left:0;right:0;top:46px;bottom:0;display:flex;flex-direction:column;justify-content:flex-end;padding:18px 24px 20px;overflow:hidden;font-family:"Cascadia Mono","Cascadia Code",Consolas,monospace;white-space:pre-wrap;word-break:break-all}
  .ln{flex:none}
  .gap{flex:none}
  .pr{color:var(--acc2);margin-right:.5em}
  .c0{color:#7cc0ff;font-weight:700}.fl{color:#a2b3cf}.pa{color:#8fe3d4}.tx{color:#eef4ff}
  .k{color:#7f8da6}.v{color:#eef4ff}.dg{color:#7fd8c8}.er{color:#ff8f7e;font-weight:600}
  .ex{color:#6f7f99}.ex.z{color:#5be08a}.ex.nz{color:#ffb347}
  .cur{display:inline-block;width:.55em;height:1.05em;background:#cfe3ff;vertical-align:-.15em;margin-left:2px}
  .win{box-sizing:border-box;position:absolute;border-radius:22px;overflow:hidden;background:#121212;border:1px solid #223049;box-shadow:0 40px 110px rgba(0,0,0,.6),0 0 0 1px rgba(77,163,255,.1)}
  .win .pbar{position:absolute;left:0;right:0;top:0;z-index:2}
  .win .shot{position:absolute;left:0;top:46px;width:100%;height:auto;transform-origin:0% 0%;will-change:transform,opacity}
  .chip{box-sizing:border-box;position:absolute;border-radius:18px;background:#0b1220;border:1px solid #223049;display:flex;align-items:center;gap:16px;padding:0 22px;font-weight:650;will-change:transform,opacity}
  .chip b{font:700 .62em "Cascadia Mono",Consolas,monospace;color:var(--acc)}
  .chip.deep{border-color:#35d6c0;box-shadow:0 0 38px rgba(53,214,192,.22)}
  .chip.deep b{color:var(--acc2)}
  .mono{font-family:"Cascadia Mono","Cascadia Code",Consolas,monospace}
  #prog{position:absolute;left:0;bottom:0;height:6px;background:linear-gradient(90deg,var(--acc),var(--acc2));width:0}
</style>
</head>
<body>
<div id="bg"></div><div id="grid"></div><div id="flash"></div>
<div id="root"></div>
<div id="prog"></div>
<script>
const clamp = (x, a = 0, b = 1) => Math.min(b, Math.max(a, x));
const easeOut = (x) => 1 - Math.pow(1 - clamp(x), 3);
const easeBack = (x) => { const c1 = 1.5, c3 = c1 + 1; x = clamp(x); return 1 + c3 * Math.pow(x - 1, 3) + c1 * Math.pow(x - 1, 2); };
const easeIO = (x) => { x = clamp(x); return x < 0.5 ? 4 * x * x * x : 1 - Math.pow(-2 * x + 2, 3) / 2; };
const esc = (s) => s.replace(/&/g, '&amp;').replace(/</g, '&lt;').replace(/>/g, '&gt;');
const HEX = (size, color) => `<svg width="${size}" height="${size}" viewBox="0 0 34 34"><path class="hexp" d="M17 2.5 29.6 9.75v14.5L17 31.5 4.4 24.25V9.75Z" fill="none" stroke="${color || '#4da3ff'}" stroke-width="2.2" stroke-linejoin="round" pathLength="100" stroke-dasharray="100" stroke-dashoffset="0"/><circle class="hexc" cx="17" cy="17" r="4.2" fill="#35d6c0"/></svg>`;

let W, H, S, L, CUT, DATA, CFG, beats = [], DURATION;

function layout() {
  const x0 = W * 0.1, y0 = H * 0.1, sw = W * 0.8, sh = H * 0.8;
  const wide = W / H > 1.5;
  const T = wide ? { x: x0, y: y0, w: sw * 0.42, h: sh } : { x: x0, y: y0, w: sw, h: sh * 0.34 };
  const P = wide ? { x: x0 + sw * 0.46, y: y0, w: sw * 0.54, h: sh } : { x: x0, y: y0 + sh * 0.38, w: sw, h: sh * 0.62 };
  const hs = wide ? 88 : (H > W ? 92 : 84);
  return { x0, y0, sw, sh, wide, T, P, hs, ts: wide ? 27 : 27 };
}
const place = (el, r) => { el.style.left = r.x + 'px'; el.style.top = r.y + 'px'; el.style.width = r.w + 'px'; if (r.h !== undefined) el.style.height = r.h + 'px'; };
const mk = (parent, cls, html, style) => { const d = document.createElement('div'); d.className = cls; if (html !== undefined) d.innerHTML = html; if (style) Object.assign(d.style, style); parent.appendChild(d); return d; };

// ---- terminal panel driven by real excerpts ----
function tokens(cmd) {
  const parts = cmd.match(/\S+|\s+/g) || []; let first = true;
  return parts.map((p) => {
    if (/^\s+$/.test(p)) return p;
    let cls = 'tx';
    if (first) { cls = 'c0'; first = false; } else if (p.startsWith('-')) cls = 'fl'; else if (/[\/\\]|\.\w+$/.test(p)) cls = 'pa';
    return `<span class="${cls}">${esc(p)}</span>`;
  }).join('');
}
function outLine(line, err) {
  if (err) return `<div class="ln er">${esc(line)}</div>`;
  const m = /^([A-Za-z][A-Za-z0-9]*): (.*)$/.exec(line);
  if (m) return `<div class="ln"><span class="k">${m[1]}:</span> <span class="${/^sha256:/.test(m[2]) ? 'dg' : 'v'}">${esc(m[2])}</span></div>`;
  return `<div class="ln v">${esc(line)}</div>`;
}
function termPanel(parent, rect, title, items, opt) {
  const el = mk(parent, 'panel'); place(el, rect);
  el.innerHTML = `<div class="pbar"><i></i><i></i><i></i><span>${esc(title)}</span></div><div class="screen" style="font-size:${opt.font}px;line-height:${Math.round(opt.font * 1.38)}px"></div>`;
  const screen = el.querySelector('.screen');
  const cps = opt.cps || 60;
  let t = opt.lead || 0.2; const plan = [];
  for (const it of items) {
    const typeDur = Math.min(it.display.length / cps, opt.maxType || 1.6);
    const outStart = t + typeDur + 0.22, outDur = Math.min(0.5, it.lines.length * 0.08);
    plan.push({ it, ts: t, te: t + typeDur, os: outStart, od: outDur });
    t = outStart + outDur + (opt.gap === undefined ? 0.35 : opt.gap);
  }
  const total = t;
  const render = (u) => {
    let html = '';
    for (const p of plan) {
      if (u < p.ts) break;
      const n = Math.floor(clamp((u - p.ts) / Math.max(0.01, p.te - p.ts)) * p.it.display.length + 1e-6);
      html += `<div class="ln"><span class="pr">&#10095;</span>${tokens(p.it.display.slice(0, n))}${u < p.te ? '<span class="cur"></span>' : ''}</div>`;
      if (u >= p.os) {
        const k = Math.ceil(clamp((u - p.os) / Math.max(0.01, p.od)) * p.it.lines.length - 1e-6);
        for (let i = 0; i < k; i++) html += outLine(p.it.lines[i][0], p.it.lines[i][1]);
        if (k >= p.it.lines.length) html += `<div class="ln ex ${p.it.exit === 0 ? 'z' : 'nz'}">exit ${p.it.exit}</div>`;
      }
      html += `<div class="gap" style="height:${Math.round(opt.font * 0.45)}px"></div>`;
    }
    screen.innerHTML = html;
  };
  return { el, render, total };
}

// ---- kinetic words ----
function kinetic(parent, rect, words, size, cls) {
  const el = mk(parent, 'hl ' + (cls || ''), '', { fontSize: size + 'px' }); place(el, rect);
  const spans = words.map((w) => { const s = document.createElement('span'); s.className = 'w' + (w.cls ? ' ' + w.cls : ''); s.textContent = w.t; el.appendChild(s); return { s, at: w.at }; });
  return { el, spans };
}
function pop(spans, u, dur = 0.5, rise = 46) {
  spans.forEach(({ s, at }) => {
    const k = clamp((u - at) / dur), e = easeBack(k);
    s.style.opacity = String(clamp(k * 2.2));
    s.style.transform = `translateY(${((1 - e) * rise).toFixed(1)}px) scale(${(1.14 - 0.14 * easeOut(k)).toFixed(3)})`;
    s.style.filter = `blur(${((1 - easeOut(k)) * 14).toFixed(1)}px)`;
  });
}

function build(cfg) {
  CFG = cfg; W = cfg.W; H = cfg.H; CUT = cfg.cut; DATA = cfg.data; L = layout();
  document.documentElement.style.width = W + 'px'; document.documentElement.style.height = H + 'px';
  document.body.style.width = W + 'px'; document.body.style.height = H + 'px';
  const bg = document.getElementById('bg');
  bg.style.background = 'radial-gradient(40% 40% at 20% 25%,rgba(77,163,255,.28),transparent 70%),radial-gradient(45% 45% at 85% 80%,rgba(53,214,192,.20),transparent 70%),#05080f';
  const root = document.getElementById('root'); root.innerHTML = '';
  const sch = cfg.cover ? [['b1', 0, 10, 10]] : CUT === 15
    ? [['b1', 0, 3.2, 3.2], ['b2', 3.0, 5.4, 2.4], ['b3', 5.2, 8.9, 5.5], ['b5', 8.7, 12.2, 7.3], ['b7', 12.0, 15.0, 3.0]]
    : [['b1', 0, 3.3, 3.3], ['b2', 3.1, 6.3, 3.2], ['b3', 6.1, 11.6, 5.5], ['b4', 11.4, 16.1, 4.7], ['b5', 15.9, 23.2, 7.3], ['b6', 23.0, 27.2, 4.2], ['b7', 27.0, 30.0, 3.0]];
  DURATION = cfg.cover ? 10 : CUT;
  beats = [];
  const f = Math.round(L.ts * (L.wide ? 1.0 : 1.0));
  const hs = L.hs;
  for (const [id, t0, t1, nominal] of sch) {
    const el = mk(root, 'beat'); const b = { id, t0, t1, nominal, el, update: null };
    const T = L.T, P = L.P;
    if (id === 'b1') {
      const dy = CFG.cover && !L.wide ? 90 : 0; // the cover frame carries a brand line above the headline in the tall layouts
      const a = kinetic(el, { x: T.x, y: dy + T.y + (L.wide ? T.h * 0.28 : T.h * 0.04), w: T.w, h: T.h }, [{ t: 'Change', at: 0.1 }, { t: 'one', at: 0.35 }, { t: 'byte.', at: 0.6 }], hs);
      const c = kinetic(el, { x: T.x, y: dy + T.y + (L.wide ? T.h * 0.28 + hs * 2.15 : T.h * 0.04 + hs * 1.1), w: T.w, h: T.h }, [{ t: 'Verification', at: 1.55, cls: 'bad' }, { t: 'fails.', at: 1.8, cls: 'bad' }], hs);
      if (CFG.cover) mk(el, 'abs', `<span style="display:inline-flex;align-items:center;gap:16px;font-weight:700;font-size:${L.wide ? 40 : 38}px">${HEX(L.wide ? 52 : 48)}<span>MemoryOS <span style="color:#93a3bd;font-weight:600">1.3</span></span></span>`, { left: T.x + 'px', top: T.y + 'px' });
      const tp = termPanel(el, { ...P, y: P.y + dy, h: P.h - dy }, 'verify', DATA.hook, { font: L.wide ? 26 : 26, cps: 150, lead: 0.85, gap: 0.12, maxType: 0.4 });
      b.update = (u) => {
        pop(a.spans, u); pop(c.spans, u);
        const k = easeOut((u - 0.7) / 0.5); tp.el.style.opacity = k; tp.el.style.transform = `translateY(${(1 - k) * 60}px)`;
        tp.render(u);
        document.getElementById('flash').style.opacity = String(Math.max(0, 1 - Math.abs(u - 2.15) / 0.35) * (u > 1.8 ? 1 : 0) * 0.9);
      };
    } else if (id === 'b2') {
      const wrap = mk(el, 'abs', '', { left: L.x0 + 'px', top: L.y0 + 'px', width: L.sw + 'px', height: L.sh + 'px', display: 'flex', flexDirection: 'column', alignItems: 'center', justifyContent: 'center', textAlign: 'center' });
      const hex = mk(wrap, '', HEX(Math.round(hs * 1.6)), { marginBottom: Math.round(hs * 0.25) + 'px' });
      const t1el = kinetic(wrap, { x: 0, y: 0, w: L.sw }, [{ t: 'MemoryOS', at: 0.55, cls: 'acc' }, { t: '1.3', at: 0.8 }], Math.round(hs * 1.25));
      t1el.el.style.position = 'relative'; t1el.el.style.left = '0'; t1el.el.style.top = '0'; t1el.el.style.width = 'auto';
      const sub = mk(wrap, 'sub', 'Investigation History', { position: 'relative', fontSize: Math.round(hs * 0.42) + 'px', marginTop: Math.round(hs * 0.25) + 'px' });
      b.update = (u) => {
        const k = clamp(u / 0.8); hex.querySelector('.hexp').setAttribute('stroke-dashoffset', String((1 - easeIO(k)) * 100));
        hex.querySelector('.hexc').style.opacity = String(easeOut((u - 0.5) / 0.3));
        pop(t1el.spans, u, 0.5, 40);
        const s = easeOut((u - 1.3) / 0.5); sub.style.opacity = s; sub.style.transform = `translateY(${(1 - s) * 24}px)`;
      };
    } else if (id === 'b3') {
      const k1 = kinetic(el, { x: T.x, y: T.y + (L.wide ? T.h * 0.2 : 0), w: T.w, h: T.h }, [{ t: 'Append-only.', at: 0.2 }], hs, '');
      const k2 = kinetic(el, { x: T.x, y: T.y + (L.wide ? T.h * 0.2 : 0) + hs * 1.1, w: T.w, h: T.h }, [{ t: 'Hash-chained.', at: 1.35, cls: 'acc' }], hs, '');
      const k3 = kinetic(el, { x: T.x, y: T.y + (L.wide ? T.h * 0.2 : 0) + hs * 2.2, w: T.w, h: T.h }, [{ t: 'Verifiable.', at: 2.5 }], hs, '');
      const tp = termPanel(el, P, 'memoryos history', DATA.ledger, { font: L.wide ? 26 : 30, cps: 120, lead: 0.1, gap: 0.12, maxType: 0.5 });
      b.update = (u) => {
        pop(k1.spans, u); pop(k2.spans, u); pop(k3.spans, u);
        const k = easeOut((u - 0.05) / 0.5); tp.el.style.opacity = k; tp.el.style.transform = `translateX(${(1 - k) * 80}px)`;
        tp.render(u * 0.95);
      };
    } else if (id === 'b4') {
      const k1 = kinetic(el, { x: T.x, y: T.y + (L.wide ? T.h * 0.28 : 0), w: T.w, h: T.h }, [{ t: 'Query', at: 0.2 }, { t: 'it.', at: 0.4 }], hs);
      const k2 = kinetic(el, { x: T.x, y: T.y + (L.wide ? T.h * 0.28 : 0) + hs * 1.15, w: T.w, h: T.h }, [{ t: 'Export', at: 1.6, cls: 'acc' }, { t: 'it.', at: 1.8, cls: 'acc' }], hs);
      const tp = termPanel(el, P, 'memoryos history', DATA.query, { font: L.wide ? 26 : 30, cps: 100, lead: 0.15, gap: 0.45, maxType: 0.9 });
      b.update = (u) => {
        pop(k1.spans, u); pop(k2.spans, u);
        const k = easeOut(u / 0.5); tp.el.style.opacity = k; tp.el.style.transform = `translateX(${(1 - k) * 80}px)`;
        tp.render(u);
      };
    } else if (id === 'b5') {
      const k1 = kinetic(el, { x: T.x, y: T.y + (L.wide ? T.h * 0.2 : 0), w: T.w, h: T.h }, [{ t: 'Then', at: 0.15 }, { t: 'see', at: 0.35 }, { t: 'it.', at: 0.55 }], hs);
      const sub = mk(el, 'sub', 'A static dashboard.<br>Offline. Read-only.', { fontSize: Math.round(hs * 0.38) + 'px', lineHeight: '1.25' });
      place(sub, { x: T.x, y: T.y + (L.wide ? T.h * 0.2 : 0) + hs * 1.25, w: T.w });
      sub.style.opacity = 0;
      const wr = { x: P.x, y: P.y + (L.wide ? P.h * 0.1 : 0), w: P.w };
      const ratio = 1440 / 2560; const wh = Math.min(P.h - (L.wide ? P.h * 0.2 : 0), 46 + wr.w * ratio);
      const win = mk(el, 'win'); win.style.left = wr.x + 'px'; win.style.top = wr.y + 'px'; win.style.width = wr.w + 'px'; win.style.height = wh + 'px';
      win.innerHTML = `<div class="pbar"><i></i><i></i><i></i><span>Microsoft Edge · local file</span></div><img class="shot s1" src="${DATA.stills.top}"><img class="shot s2" src="${DATA.stills.filtered}">`;
      const s1 = win.querySelector('.s1'), s2 = win.querySelector('.s2');
      s2.style.transformOrigin = L.wide ? '0% 55%' : '0% 58%';
      b.update = (u) => {
        pop(k1.spans, u);
        const s = easeOut((u - 1.4) / 0.5); sub.style.opacity = s; sub.style.transform = `translateY(${(1 - s) * 22}px)`;
        const k = easeOut(u / 0.6); win.style.opacity = k; win.style.transform = `translateY(${(1 - k) * 70}px) scale(${0.96 + 0.04 * k})`;
        const sw = easeIO((u - 3.5) / 0.6);
        s1.style.opacity = String(1 - sw); s2.style.opacity = String(sw);
        const z1 = (L.wide ? 1.35 : 1.85) + 0.12 * clamp(u / 4), z2 = (L.wide ? 1.35 : 1.7) + 0.12 * clamp((u - 3.5) / 3.5);
        s1.style.transform = `scale(${z1.toFixed(3)})`; s2.style.transform = `scale(${z2.toFixed(3)})`;
      };
    } else if (id === 'b6') {
      const k1 = kinetic(el, { x: T.x, y: T.y + (L.wide ? T.h * 0.3 : 0), w: T.w, h: T.h }, [{ t: 'Nine', at: 0.1 }, { t: 'milestones.', at: 0.3, cls: 'acc' }], hs);
      const names = [['01', 'Policies'], ['02', 'GitHub CI gate'], ['03', 'VS Code'], ['04', 'MCP'], ['05', 'REST'], ['06', 'CI/CD'], ['07', 'Readiness'], ['08', 'History'], ['09', 'Dashboard']];
      const gap = 18, cw = (P.w - gap * 2) / 3, rows = 3, ch = Math.min(120, (P.h * (L.wide ? 0.7 : 1) - gap * (rows - 1)) / rows);
      const gy = P.y + (L.wide ? (P.h - (ch * rows + gap * 2)) / 2 : 0);
      const chips = names.map(([n, name], i) => {
        const c = mk(el, 'chip' + (i >= 7 ? ' deep' : ''), `<b>${n}</b><span>${name}</span>`, { left: P.x + (i % 3) * (cw + gap) + 'px', top: gy + Math.floor(i / 3) * (ch + gap) + 'px', width: cw + 'px', height: ch + 'px', fontSize: Math.round(ch * 0.27) + 'px' });
        return { c, at: 0.25 + i * 0.36 };
      });
      b.update = (u) => {
        pop(k1.spans, u);
        chips.forEach(({ c, at }) => { const k = easeBack((u - at) / 0.4); c.style.opacity = String(clamp((u - at) / 0.2)); c.style.transform = `scale(${(0.7 + 0.3 * k).toFixed(3)})`; });
      };
    } else if (id === 'b7') {
      const wrap = mk(el, 'abs', '', { left: L.x0 + 'px', top: L.y0 + 'px', width: L.sw + 'px', height: L.sh + 'px', display: 'flex', flexDirection: 'column', alignItems: 'center', justifyContent: 'center', textAlign: 'center' });
      const hex = mk(wrap, '', HEX(Math.round(hs * 1.1)), { marginBottom: Math.round(hs * 0.2) + 'px' });
      const t1el = kinetic(wrap, { x: 0, y: 0, w: L.sw }, [{ t: 'MemoryOS', at: 0.15, cls: 'acc' }, { t: '1.3', at: 0.35 }], Math.round(hs * 1.3));
      t1el.el.style.position = 'relative'; t1el.el.style.left = '0'; t1el.el.style.top = '0'; t1el.el.style.width = 'auto';
      const url = mk(wrap, 'mono', 'github.com/moelsaka01/memoryos-specification', { position: 'relative', color: '#7cc0ff', fontWeight: 600, fontSize: Math.round(L.wide ? 38 : Math.min(32, L.sw / 27)) + 'px', marginTop: Math.round(hs * 0.3) + 'px' });
      const fine = mk(wrap, 'sub', 'Release v1.3.0 · Local single-user v1<br>Integrity checks, not approvals', { position: 'relative', fontSize: (L.wide ? 26 : 24) + 'px', marginTop: Math.round(hs * 0.28) + 'px', lineHeight: '1.4', fontWeight: 500 });
      b.update = (u) => {
        const k = clamp(u / 0.5); hex.querySelector('.hexp').setAttribute('stroke-dashoffset', String((1 - easeIO(k)) * 100));
        pop(t1el.spans, u, 0.5, 40);
        const a = easeOut((u - 0.8) / 0.5); url.style.opacity = a; url.style.transform = `translateY(${(1 - a) * 18}px)`;
        const c = easeOut((u - 1.3) / 0.5); fine.style.opacity = c; fine.style.transform = `translateY(${(1 - c) * 14}px)`;
      };
    }
    beats.push(b);
  }
  return DURATION;
}

function renderAt(t) {
  const bg = document.getElementById('bg');
  bg.style.transform = `translate(${(Math.sin(t * 0.35) * 40).toFixed(1)}px,${(Math.cos(t * 0.27) * 30).toFixed(1)}px) scale(${(1.05 + 0.03 * Math.sin(t * 0.2)).toFixed(3)})`;
  document.getElementById('grid').style.backgroundPosition = `${(t * 6).toFixed(1)}px ${(t * 4).toFixed(1)}px`;
  document.getElementById('flash').style.opacity = '0';
  for (const b of beats) {
    const active = t >= b.t0 && t <= b.t1;
    if (!active) { b.el.style.opacity = '0'; b.el.style.display = 'none'; continue; }
    b.el.style.display = 'block';
    const fadeIn = b.t0 === 0 ? 1 : easeOut((t - b.t0) / 0.25), fadeOut = b.t1 >= DURATION - 0.001 ? 1 : easeOut((b.t1 - t) / 0.25);
    b.el.style.opacity = String(Math.min(fadeIn, fadeOut).toFixed(3));
    const u = (t - b.t0) * (b.nominal / (b.t1 - b.t0));
    b.update(u);
  }
  document.getElementById('prog').style.width = CFG.cover ? '0px' : (t / DURATION * W).toFixed(1) + 'px';
  return true;
}
window.build = build; window.renderAt = renderAt;
</script>
</body>
</html>
