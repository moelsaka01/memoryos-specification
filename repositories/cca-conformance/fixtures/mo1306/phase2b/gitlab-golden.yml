stages:
  - 'test'
memoryos_policy:
  stage: 'test'
  tags:
    - 'windows_2022'
  when: 'manual'
  allow_failure: false
  timeout: '5m'
  retry: 0
  script:
    - |
      $status = 16
      try {
        & (Join-Path $env:MEMORYOS_CI_HOME 'scripts/Invoke-MemoryOSCI.ps1') -Provider 'gitlab' -Workspace $env:CI_PROJECT_DIR -ConfigurationDigest 'sha256:1111111111111111111111111111111111111111111111111111111111111111' -DistributionDigest 'sha256:2222222222222222222222222222222222222222222222222222222222222222'
        $status = $LASTEXITCODE
      } finally {
        exit $status
      }
