stages:
  - 'test'
memoryos_policy:
  stage: 'test'
  tags:
    - 'windows_2022'
  when: 'manual'
  allow_failure: false
  timeout: '5m'
  retry: 0
  script:
    - |
      $status = 16
      try {
        & (Join-Path $env:MEMORYOS_CI_HOME 'scripts/Invoke-MemoryOSCI.ps1') -Provider 'gitlab' -Workspace $env:CI_PROJECT_DIR -ConfigurationDigest 'sha256:12ddefe6af24e3364dfee0c081ad4a41061bcf8aa4804716bb6ee65aa5483afb' -DistributionDigest 'sha256:816852914f943bee7465e7d8fd0bce754f885c78777738666810dc0ec748709e'
        $status = $LASTEXITCODE
      } finally {
        exit $status
      }
