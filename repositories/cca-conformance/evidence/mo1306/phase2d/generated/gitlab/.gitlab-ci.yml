stages:
  - 'test'
memoryos_policy:
  stage: 'test'
  tags:
    - 'MemoryOS_Windows'
  when: 'manual'
  allow_failure: false
  timeout: '5m'
  retry: 0
  script:
    - |
      $status = 16
      try {
        & (Join-Path $env:MEMORYOS_CI_HOME 'scripts/Invoke-MemoryOSCI.ps1') -Provider 'gitlab' -Workspace $env:CI_PROJECT_DIR -ConfigurationDigest 'sha256:12ddefe6af24e3364dfee0c081ad4a41061bcf8aa4804716bb6ee65aa5483afb' -DistributionDigest 'sha256:bd154a7a972395b801b3cb0189a728b7e9870eb05f90558346eb7fee7055fe77'
        $status = $LASTEXITCODE
      } finally {
        exit $status
      }
