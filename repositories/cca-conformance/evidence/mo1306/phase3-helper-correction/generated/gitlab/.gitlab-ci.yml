stages:
  - 'test'
memoryos_policy:
  stage: 'test'
  tags:
    - 'MemoryOS_Windows'
  when: 'manual'
  allow_failure: false
  timeout: '5m'
  retry: 0
  script:
    - |
      $status = 16
      try {
        & (Join-Path $env:MEMORYOS_CI_HOME 'scripts/Invoke-MemoryOSCI.ps1') -Provider 'gitlab' -Workspace $env:CI_PROJECT_DIR -ConfigurationDigest 'sha256:12ddefe6af24e3364dfee0c081ad4a41061bcf8aa4804716bb6ee65aa5483afb' -DistributionDigest 'sha256:b41d024d8ec1c588ca3fc919f8e3ac59a622aebc7cff3377f6a20ce7fc2ca4f3'
        $status = $LASTEXITCODE
      } finally {
        exit $status
      }
