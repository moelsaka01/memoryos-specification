trigger: 'none'
pr: 'none'
pool:
  name: 'MemoryOS_Windows'
  demands:
    - 'Agent.OS -equals Windows_NT'
jobs:
  - job: 'memoryos_policy'
    timeoutInMinutes: 5
    cancelTimeoutInMinutes: 1
    steps:
      - checkout: 'self'
        persistCredentials: false
        submodules: false
        lfs: false
      - powershell: |
          $ErrorActionPreference = 'Stop'
          & (Join-Path $env:MEMORYOS_CI_HOME 'scripts\Invoke-MemoryOSCI.ps1') -Provider 'azure' -Workspace $env:BUILD_SOURCESDIRECTORY -ConfigurationDigest 'sha256:12ddefe6af24e3364dfee0c081ad4a41061bcf8aa4804716bb6ee65aa5483afb' -DistributionDigest 'sha256:311927a980bd397ab70b95da77d546e4b212968d05973ecf998817764431d773'
          $gateExit = $LASTEXITCODE
          exit $gateExit
        displayName: 'MemoryOS Policy'
        failOnStderr: false
        ignoreLASTEXITCODE: false
