name: MemoryOS Policy Gate

on:
  workflow_call:
    inputs:
      policy-kind:
        description: Policy artifact kind, exactly policy or policy-set.
        required: true
        type: string
      policy-path:
        description: Workspace-relative Policy or Policy Set path.
        required: true
        type: string
      expected-policy-semantic-digest:
        description: Frozen expected Policy or Policy Set semantic digest.
        required: true
        type: string
      candidate-mip-path:
        description: Workspace-relative candidate MIP path; mutually exclusive with candidate-mip-artifact-name.
        required: false
        default: ""
        type: string
      regression-baseline-mip-path:
        description: Optional workspace-relative Regression baseline MIP path.
        required: false
        default: ""
        type: string
      candidate-mip-artifact-name:
        description: Optional exact current-run artifact name containing the candidate MIP.
        required: false
        default: ""
        type: string
      regression-baseline-mip-artifact-name:
        description: Optional exact current-run artifact name containing the Regression baseline MIP.
        required: false
        default: ""
        type: string
      retention-days:
        description: Verified gate-artifact retention in days, from 1 through 90.
        required: false
        default: 14
        type: number
    outputs:
      gate-class:
        description: Frozen gate classification.
        value: ${{ jobs.gate.outputs.gate-class }}
      decision:
        description: Verified Policy decision, or empty for tool failure.
        value: ${{ jobs.gate.outputs.decision }}
      cli-exit-code:
        description: Original protocol-valid evaluation exit when available.
        value: ${{ jobs.gate.outputs.cli-exit-code }}
      publication-valid:
        description: Whether a retained normative publication generation is verified.
        value: ${{ jobs.gate.outputs.publication-valid }}
      policy-semantic-digest:
        description: Verified Policy or Policy Set semantic digest.
        value: ${{ jobs.gate.outputs.policy-semantic-digest }}
      evaluation-identity-digest:
        description: Verified Evaluation Identity digest.
        value: ${{ jobs.gate.outputs.evaluation-identity-digest }}
      outcome-digest:
        description: Verified outcome digest.
        value: ${{ jobs.gate.outputs.outcome-digest }}
      policy-fact-context-digest:
        description: Verified PolicyFactContext digest.
        value: ${{ jobs.gate.outputs.policy-fact-context-digest }}
      regression-source-digest:
        description: Verified Regression source digest, or empty when absent.
        value: ${{ jobs.gate.outputs.regression-source-digest }}
      stable-code:
        description: Frozen primary stable code when applicable.
        value: ${{ jobs.gate.outputs.stable-code }}
      failure-class:
        description: Frozen failure class, or empty for a verified Policy decision.
        value: ${{ jobs.gate.outputs.failure-class }}
      phase:
        description: Frozen failure phase, or empty for a verified Policy decision.
        value: ${{ jobs.gate.outputs.phase }}
      artifact-kind:
        description: Verified or failure-associated artifact kind when available.
        value: ${{ jobs.gate.outputs.artifact-kind }}
      limit-identifier:
        description: Root resource-limit identifier when applicable.
        value: ${{ jobs.gate.outputs.limit-identifier }}
      distribution-repository:
        description: Verified Action distribution repository.
        value: ${{ jobs.gate.outputs.distribution-repository }}
      distribution-revision:
        description: Verified immutable Action distribution revision.
        value: ${{ jobs.gate.outputs.distribution-revision }}
      artifact-name:
        description: Uploaded GitHub transport artifact name, or empty when not published.
        value: ${{ jobs.gate.outputs.artifact-name }}
      artifact-id:
        description: Uploaded GitHub transport artifact identifier, or empty when not published.
        value: ${{ jobs.gate.outputs.artifact-id }}

permissions:
  actions: read
  contents: read

jobs:
  gate:
    name: MemoryOS Policy Gate
    runs-on: ubuntu-24.04
    outputs:
      gate-class: ${{ steps.finalize.outputs.gate-class }}
      decision: ${{ steps.finalize.outputs.decision }}
      cli-exit-code: ${{ steps.finalize.outputs.cli-exit-code }}
      publication-valid: ${{ steps.finalize.outputs.publication-valid }}
      policy-semantic-digest: ${{ steps.finalize.outputs.policy-semantic-digest }}
      evaluation-identity-digest: ${{ steps.finalize.outputs.evaluation-identity-digest }}
      outcome-digest: ${{ steps.finalize.outputs.outcome-digest }}
      policy-fact-context-digest: ${{ steps.finalize.outputs.policy-fact-context-digest }}
      regression-source-digest: ${{ steps.finalize.outputs.regression-source-digest }}
      stable-code: ${{ steps.finalize.outputs.stable-code }}
      failure-class: ${{ steps.finalize.outputs.failure-class }}
      phase: ${{ steps.finalize.outputs.phase }}
      artifact-kind: ${{ steps.finalize.outputs.artifact-kind }}
      limit-identifier: ${{ steps.finalize.outputs.limit-identifier }}
      distribution-repository: ${{ steps.finalize.outputs.distribution-repository }}
      distribution-revision: ${{ steps.finalize.outputs.distribution-revision }}
      artifact-name: ${{ steps.finalize.outputs.artifact-name }}
      artifact-id: ${{ steps.finalize.outputs.artifact-id }}
    steps:
      - name: Checkout hostile Policy and MIP data
        id: checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Validate workflow inputs and resolve same-run artifacts
        id: prepare
        uses: $/.github/actions/memoryos-policy-gate-workflow-support
        env:
          GITHUB_TOKEN: ${{ github.token }}
        with:
          mode: prepare
          policy-kind: ${{ inputs.policy-kind }}
          policy-path: ${{ inputs.policy-path }}
          expected-policy-semantic-digest: ${{ inputs.expected-policy-semantic-digest }}
          candidate-mip-path: ${{ inputs.candidate-mip-path }}
          regression-baseline-mip-path: ${{ inputs.regression-baseline-mip-path }}
          candidate-mip-artifact-name: ${{ inputs.candidate-mip-artifact-name }}
          regression-baseline-mip-artifact-name: ${{ inputs.regression-baseline-mip-artifact-name }}
          retention-days: ${{ inputs.retention-days }}
          run-id: ${{ github.run_id }}
          run-attempt: ${{ github.run_attempt }}
          check-run-id: ${{ job.check_run_id }}

      - name: Download exact candidate archive without extraction
        id: download-candidate
        if: steps.prepare.outputs.candidate-artifact-id != ''
        uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          artifact-ids: ${{ steps.prepare.outputs.candidate-artifact-id }}
          path: ${{ runner.temp }}/memoryos-policy-gate-${{ github.run_id }}-${{ github.run_attempt }}-${{ job.check_run_id }}/candidate-archive
          skip-decompress: true
          digest-mismatch: error

      - name: Validate and extract the candidate archive
        id: extract-candidate
        if: steps.prepare.outputs.candidate-artifact-id != ''
        uses: $/.github/actions/memoryos-policy-gate-workflow-support
        env:
          GITHUB_TOKEN: ${{ github.token }}
        with:
          mode: extract
          artifact-role: candidate
          artifact-name: ${{ inputs.candidate-mip-artifact-name }}
          artifact-id: ${{ steps.prepare.outputs.candidate-artifact-id }}
          run-id: ${{ github.run_id }}
          archive-directory: ${{ runner.temp }}/memoryos-policy-gate-${{ github.run_id }}-${{ github.run_attempt }}-${{ job.check_run_id }}/candidate-archive

      - name: Download exact Regression baseline archive without extraction
        id: download-baseline
        if: steps.prepare.outputs.baseline-artifact-id != ''
        uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          artifact-ids: ${{ steps.prepare.outputs.baseline-artifact-id }}
          path: ${{ runner.temp }}/memoryos-policy-gate-${{ github.run_id }}-${{ github.run_attempt }}-${{ job.check_run_id }}/baseline-archive
          skip-decompress: true
          digest-mismatch: error

      - name: Validate and extract the Regression baseline archive
        id: extract-baseline
        if: steps.prepare.outputs.baseline-artifact-id != ''
        uses: $/.github/actions/memoryos-policy-gate-workflow-support
        env:
          GITHUB_TOKEN: ${{ github.token }}
        with:
          mode: extract
          artifact-role: baseline
          artifact-name: ${{ inputs.regression-baseline-mip-artifact-name }}
          artifact-id: ${{ steps.prepare.outputs.baseline-artifact-id }}
          run-id: ${{ github.run_id }}
          archive-directory: ${{ runner.temp }}/memoryos-policy-gate-${{ github.run_id }}-${{ github.run_attempt }}-${{ job.check_run_id }}/baseline-archive

      - name: Evaluate and verify the deterministic Policy gate
        id: policy-gate
        continue-on-error: true
        uses: $/.github/actions/memoryos-policy-gate
        with:
          policy-kind: ${{ inputs.policy-kind }}
          policy-path: ${{ inputs.policy-path }}
          expected-policy-semantic-digest: ${{ inputs.expected-policy-semantic-digest }}
          candidate-mip-path: ${{ steps.extract-candidate.outputs.mip-path || inputs.candidate-mip-path }}
          regression-baseline-mip-path: ${{ steps.extract-baseline.outputs.mip-path || inputs.regression-baseline-mip-path }}

      - name: Upload the verified publication generation
        id: upload
        if: always() && steps.policy-gate.outputs.publication-valid == 'true'
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: ${{ steps.prepare.outputs.upload-artifact-name }}
          path: |
            ${{ steps.policy-gate.outputs.artifact-directory }}/evaluation-identity.json
            ${{ steps.policy-gate.outputs.artifact-directory }}/evaluation-identity.sha256
            ${{ steps.policy-gate.outputs.artifact-directory }}/evaluation-outcome.json
            ${{ steps.policy-gate.outputs.artifact-directory }}/evaluation-outcome.sha256
            ${{ steps.policy-gate.outputs.artifact-directory }}/policy-identities.json
            ${{ steps.policy-gate.outputs.artifact-directory }}/gate-receipt.json
          if-no-files-found: error
          retention-days: ${{ steps.prepare.outputs.retention-days }}
          overwrite: false
          include-hidden-files: false

      - name: Publish bounded presentation and enforce the final conclusion
        id: finalize
        if: always()
        uses: $/.github/actions/memoryos-policy-gate-workflow-support
        with:
          mode: finalize
          checkout-outcome: ${{ steps.checkout.outcome }}
          prepare-outcome: ${{ steps.prepare.outcome }}
          candidate-download-outcome: ${{ steps.download-candidate.outcome }}
          candidate-extract-outcome: ${{ steps.extract-candidate.outcome }}
          baseline-download-outcome: ${{ steps.download-baseline.outcome }}
          baseline-extract-outcome: ${{ steps.extract-baseline.outcome }}
          gate-outcome: ${{ steps.policy-gate.outcome }}
          upload-outcome: ${{ steps.upload.outcome }}
          upload-artifact-name: ${{ steps.prepare.outputs.upload-artifact-name }}
          upload-artifact-id: ${{ steps.upload.outputs.artifact-id }}
          pre-gate-stable-code: ${{ steps.prepare.outputs.support-stable-code || steps.extract-candidate.outputs.support-stable-code || steps.extract-baseline.outputs.support-stable-code }}
          pre-gate-phase: ${{ steps.prepare.outputs.support-phase || steps.extract-candidate.outputs.support-phase || steps.extract-baseline.outputs.support-phase }}
          outcome-path: ${{ steps.policy-gate.outputs.outcome-path }}
          gate-class: ${{ steps.policy-gate.outputs.gate-class }}
          decision: ${{ steps.policy-gate.outputs.decision }}
          cli-exit-code: ${{ steps.policy-gate.outputs.cli-exit-code }}
          publication-valid: ${{ steps.policy-gate.outputs.publication-valid }}
          policy-semantic-digest: ${{ steps.policy-gate.outputs.policy-semantic-digest }}
          evaluation-identity-digest: ${{ steps.policy-gate.outputs.evaluation-identity-digest }}
          outcome-digest: ${{ steps.policy-gate.outputs.outcome-digest }}
          policy-fact-context-digest: ${{ steps.policy-gate.outputs.policy-fact-context-digest }}
          regression-source-digest: ${{ steps.policy-gate.outputs.regression-source-digest }}
          stable-code: ${{ steps.policy-gate.outputs.stable-code }}
          failure-class: ${{ steps.policy-gate.outputs.failure-class }}
          phase: ${{ steps.policy-gate.outputs.phase }}
          artifact-kind: ${{ steps.policy-gate.outputs.artifact-kind }}
          limit-identifier: ${{ steps.policy-gate.outputs.limit-identifier }}
          distribution-repository: ${{ steps.policy-gate.outputs.distribution-repository }}
          distribution-revision: ${{ steps.policy-gate.outputs.distribution-revision }}
