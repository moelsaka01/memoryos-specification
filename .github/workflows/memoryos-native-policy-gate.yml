name: MemoryOS Native C++ Policy Gate

on:
  workflow_dispatch:

permissions:
  contents: read

env:
  VCPKG_DISABLE_METRICS: "1"

jobs:
  native-policy:
    name: Native C++ Policy (${{ matrix.os }})
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-24.04, windows-2022, macos-14]
    steps:
      - name: Check out source
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Set up Python 3.12
        uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5.6.0
        with:
          python-version: "3.12"

      - name: Bootstrap dependencies (POSIX)
        if: runner.os != 'Windows'
        run: bash scripts/bootstrap.sh --skip-configure

      - name: Bootstrap dependencies (Windows)
        if: runner.os == 'Windows'
        shell: pwsh
        run: ./scripts/bootstrap.ps1 -SkipConfigure

      - name: Configure the supported CI preset (POSIX)
        if: runner.os != 'Windows'
        run: cmake --preset ci

      - name: Configure the supported CI preset (Windows MinGW)
        if: runner.os == 'Windows'
        shell: pwsh
        run: cmake --preset ci "-DCMAKE_CXX_COMPILER=C:/mingw64/bin/c++.exe" "-DVCPKG_TARGET_TRIPLET=x64-mingw-dynamic"

      - name: Build the supported CI preset
        run: cmake --build --preset ci

      - name: Prove native Policy test registration
        run: |
          cmake -E make_directory out/native-policy-evidence
          ctest --test-dir out/build/ci --show-only=json-v1 | node repositories/cca-conformance/tools/mo1302-native-evidence.mjs registration --output out/native-policy-evidence/registration.json

      - name: Execute the focused native Policy tests
        run: ctest --test-dir out/build/ci -R "^memoryos\.sdk\.cpp\.(policy\.contract|policy\.example)$" --output-on-failure --no-tests=error --output-junit out/native-policy-evidence/ctest-results.xml

      - name: Install smoke test
        run: cmake --install out/build/ci --prefix out/stage

      - name: Produce bounded non-normative native evidence
        env:
          MEMORYOS_NATIVE_RUNNER_LABEL: ${{ matrix.os }}
          MEMORYOS_NATIVE_RUNNER_OS: ${{ runner.os }}
          MEMORYOS_NATIVE_RUNNER_ARCH: ${{ runner.arch }}
        run: node repositories/cca-conformance/tools/mo1302-native-evidence.mjs evidence --registration out/native-policy-evidence/registration.json --junit out/native-policy-evidence/ctest-results.xml --build-dir out/build/ci --install-prefix out/stage --output out/native-policy-evidence/native-policy-evidence.json

      - name: Revalidate native evidence
        run: node repositories/cca-conformance/tools/mo1302-native-evidence.mjs validate --input out/native-policy-evidence/native-policy-evidence.json

      - name: Upload native engineering evidence
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: memoryos-native-policy-${{ matrix.os }}
          path: out/native-policy-evidence/native-policy-evidence.json
          if-no-files-found: error
          retention-days: 14
          overwrite: false
          include-hidden-files: false
