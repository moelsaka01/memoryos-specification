name: CCA CI

on:
  push:
    branches: ["main"]
  pull_request:
  workflow_dispatch:

concurrency:
  group: cca-ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

env:
  VCPKG_DISABLE_METRICS: "1"

jobs:
  build-and-test:
    name: Build and test (${{ matrix.os }})
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-24.04, macos-14, windows-2022]
    steps:
      - name: Check out source
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1

      - name: Set up Python 3.12
        uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065
        with:
          python-version: "3.12"

      - name: Bootstrap dependencies (POSIX)
        if: runner.os != 'Windows'
        run: bash scripts/bootstrap.sh --skip-configure

      - name: Bootstrap dependencies (Windows)
        if: runner.os == 'Windows'
        shell: pwsh
        run: ./scripts/bootstrap.ps1 -SkipConfigure

      - name: Configure
        run: cmake --preset ci

      - name: Build
        run: cmake --build --preset ci

      - name: Test
        run: ctest --preset ci

      - name: Install smoke test
        run: cmake --install out/build/ci --prefix out/stage

  format:
    name: clang-format
    runs-on: ubuntu-24.04
    steps:
      - name: Check out source
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1

      - name: Set up Python 3.12
        uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065
        with:
          python-version: "3.12"

      - name: Install clang-format 18
        run: |
          sudo apt-get update
          sudo apt-get install --yes clang-format-18

      - name: Verify formatting
        env:
          CLANG_FORMAT: clang-format-18
        run: python3 tools/run_clang_format.py --root .

  static-analysis:
    name: clang-tidy
    runs-on: ubuntu-24.04
    steps:
      - name: Check out source
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1

      - name: Set up Python 3.12
        uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065
        with:
          python-version: "3.12"

      - name: Install clang-tidy 18
        run: |
          sudo apt-get update
          sudo apt-get install --yes clang-tidy-18

      - name: Bootstrap dependencies
        run: bash scripts/bootstrap.sh --skip-configure

      - name: Configure analysis
        run: cmake --preset analysis -DCCA_CLANG_TIDY_EXECUTABLE=/usr/bin/clang-tidy-18

      - name: Run analysis
        run: cmake --build --preset analysis

  sanitizers:
    name: AddressSanitizer and UBSan
    runs-on: ubuntu-24.04
    steps:
      - name: Check out source
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1

      - name: Set up Python 3.12
        uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065
        with:
          python-version: "3.12"

      - name: Bootstrap dependencies
        run: bash scripts/bootstrap.sh --skip-configure

      - name: Configure
        run: cmake --preset sanitizer

      - name: Build
        run: cmake --build --preset sanitizer

      - name: Test
        run: ctest --preset sanitizer

  coverage:
    name: Coverage
    runs-on: ubuntu-24.04
    steps:
      - name: Check out source
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1

      - name: Set up Python 3.12
        uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065
        with:
          python-version: "3.12"

      - name: Install coverage tooling
        run: python3 -m pip install --requirement tools/requirements-ci.txt

      - name: Bootstrap dependencies
        run: bash scripts/bootstrap.sh --skip-configure

      - name: Generate coverage report
        run: bash scripts/coverage.sh

      - name: Upload coverage report
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: cca-coverage
          path: out/build/coverage/coverage
          if-no-files-found: error
          retention-days: 14
